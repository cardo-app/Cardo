<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cardo</title>
<meta name="description" content="Cardo – Karteikarten lernen mit Spaced Repetition">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light"><!-- beim Start immer hell (weiße Statusleiste wie das Startbild); nach dem Start setzt applyTheme() die echte Farbe -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cardo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="icons/splash/iphone-402x874.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/ipad-834x1210.png" media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/ipad-1210x834.png" media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><!-- lädt im Hintergrund: blockiert das erste Bild beim Start nicht -->
<style>
/* Start: alles sofort weiß wie das Startbild von iOS (auch hinter der Statusleiste) – kein schwarzer Rand, kein Zucken */
:root{--tc:0px}
/* iOS 26+: In der installierten App legt iOS einen Weichzeichner („Liquid Glass“) über die Statusleiste und ca. 40 pt darunter.
   Dieser Streifen bleibt deshalb einfarbig (Hintergrund), der Inhalt beginnt erst darunter – so wird nichts verschwommen. */
/* (v67: hier stand ein 40-px-Abstand unter der Statusleiste; seit v68 Statusleisten-Stil „default“ → nicht mehr nötig. Bei Rückkehr zu black-translucent: --tc:40px nur für iOS-Installation) */
html{padding-top:calc(env(safe-area-inset-top,0px) + var(--tc));background:#fff}
html:has(> body.splashing:not(.intro-day):not(.splash-quick)){animation:htmlNight .9s cubic-bezier(.45,0,.55,1) .95s forwards} /* wird dunkel, wenn der Startbildschirm Nacht wird */
@keyframes htmlNight{to{background-color:#07090F}}
/* Kein Zoomen: Doppeltipp-Zoom aus */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:max(16px,1em)}
body{margin:0}
:root{
  color-scheme:light;
  --b-paper:#F5F6F8; --b-surface:#FFFFFF; --b-surface-2:#F9FAFB; --b-ink:#15171C; --b-ink-2:#3A3F4B; --b-muted:#6B7080; --b-line:#E3E5EB; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#D93A3F; --hard:#C27A12; --good:#1E8C57; --easy:#2F6FE0;
  --g-again:#FF2E63; --g-hard:#FFE600; --g-good:#00E676; --g-easy:#00B4FF; --g-tx:0%; --g-bg:22%;
  --shadow:0 1px 2px rgba(20,22,30,.06),0 6px 20px rgba(20,22,30,.06);
  --accent:#1B1D23; --accent-ink:#FFFFFF;
  --r:18px; --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --b-paper:#0F1115; --b-surface:#181B21; --b-surface-2:#1E2129; --b-ink:#ECEEF3; --b-ink-2:#C9CDD6; --b-muted:#9097A6; --b-line:#2A2E38; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#FF6B6F; --hard:#F0B04A; --good:#4CC38A; --easy:#6FA0FF;
  --g-again:#FF3D6E; --g-hard:#FFF01F; --g-good:#2BFF88; --g-easy:#1FC8FF; --g-tx:100%; --g-bg:0%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --accent:#ECEEF3; --accent-ink:#111318;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --b-paper:#0F1115; --b-surface:#181B21; --b-surface-2:#1E2129; --b-ink:#ECEEF3; --b-ink-2:#C9CDD6; --b-muted:#9097A6; --b-line:#2A2E38; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#FF6B6F; --hard:#F0B04A; --good:#4CC38A; --easy:#6FA0FF;
  --g-again:#FF3D6E; --g-hard:#FFF01F; --g-good:#2BFF88; --g-easy:#1FC8FF; --g-tx:100%; --g-bg:0%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --accent:#ECEEF3; --accent-ink:#111318;
}
/* In-app choice (Einstellungen) overrides the viewer theme */
body.m-light{
  color-scheme:light;
  --b-paper:#F5F6F8; --b-surface:#FFFFFF; --b-surface-2:#F9FAFB; --b-ink:#15171C; --b-ink-2:#3A3F4B; --b-muted:#6B7080; --b-line:#E3E5EB; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#D93A3F; --hard:#C27A12; --good:#1E8C57; --easy:#2F6FE0;
  --g-again:#FF2E63; --g-hard:#FFE600; --g-good:#00E676; --g-easy:#00B4FF; --g-tx:0%; --g-bg:22%;
  --shadow:0 1px 2px rgba(20,22,30,.06),0 6px 20px rgba(20,22,30,.06);
}
body.m-dark{
  color-scheme:dark;
  --b-paper:#0F1115; --b-surface:#181B21; --b-surface-2:#1E2129; --b-ink:#ECEEF3; --b-ink-2:#C9CDD6; --b-muted:#9097A6; --b-line:#2A2E38; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#FF6B6F; --hard:#F0B04A; --good:#4CC38A; --easy:#6FA0FF;
  --g-again:#FF3D6E; --g-hard:#FFF01F; --g-good:#2BFF88; --g-easy:#1FC8FF; --g-tx:100%; --g-bg:0%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
/* Neutral modes: no colourful accents */
body.neutral{ --accent-soft:color-mix(in oklab,var(--accent) 9%,var(--surface)); }
body.neutral .st.new,body.neutral .st.mature,body.neutral .st.due{color:var(--ink-2);border-color:var(--line)}
body.neutral .st.due{background:var(--surface-2)}
/* Colour themes: whole interface tinted */
body.tinted.m-light{ --accent-text:color-mix(in oklab,var(--accent) 62%,var(--b-ink)); --tp:48%; --ts:16%; --ts2:28%; --tl:50%; --ti:38%;
  --muted:color-mix(in oklab,var(--accent) 50%,var(--b-ink)); --ink-2:color-mix(in oklab,var(--accent) 40%,var(--b-ink));
  --accent-soft:color-mix(in oklab,var(--accent) 40%,var(--surface)); }
body:is(.beach,.aurora,.autumn){background-color:transparent}
body.hearts{background-color:transparent}
html:has(> body.hearts),body.hearts .peek{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22230%22%20height%3D%22230%22%20viewBox%3D%220%200%20230%20230%22%3E%3Cpath%20transform%3D%22translate%2834%2034%29%20rotate%28-12%29%20scale%281.333%29%20translate%28-12%20-14%29%22%20fill%3D%22%23FFFFFF%22%20fill-opacity%3D%220.6%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3Cpath%20transform%3D%22translate%28125%2024%29%20rotate%2810%29%20scale%280.867%29%20translate%28-12%20-14%29%22%20fill%3D%22%23D0106F%22%20fill-opacity%3D%220.16%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3Cpath%20transform%3D%22translate%28192%2078%29%20rotate%288%29%20scale%281.467%29%20translate%28-12%20-14%29%22%20fill%3D%22%23FFFFFF%22%20fill-opacity%3D%220.5%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3Cpath%20transform%3D%22translate%2872%20104%29%20rotate%28-6%29%20scale%281.000%29%20translate%28-12%20-14%29%22%20fill%3D%22%23D0106F%22%20fill-opacity%3D%220.14%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3Cpath%20transform%3D%22translate%28150%20146%29%20rotate%28-15%29%20scale%281.200%29%20translate%28-12%20-14%29%22%20fill%3D%22%23FFFFFF%22%20fill-opacity%3D%220.55%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3Cpath%20transform%3D%22translate%2830%20176%29%20rotate%2814%29%20scale%280.867%29%20translate%28-12%20-14%29%22%20fill%3D%22%23FFFFFF%22%20fill-opacity%3D%220.45%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3Cpath%20transform%3D%22translate%28204%20196%29%20rotate%280%29%20scale%280.800%29%20translate%28-12%20-14%29%22%20fill%3D%22%23D0106F%22%20fill-opacity%3D%220.14%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3Cpath%20transform%3D%22translate%28102%20200%29%20rotate%286%29%20scale%281.200%29%20translate%28-12%20-14%29%22%20fill%3D%22%23FFFFFF%22%20fill-opacity%3D%220.4%22%20d%3D%22M12%2021s-7.5-4.6-7.5-10A4.3%204.3%200%200%201%2012%208.3%204.3%204.3%200%200%201%2019.5%2011c0%205.4-7.5%2010-7.5%2010z%22/%3E%3C/svg%3E");background-size:230px 230px;background-repeat:repeat}
body.starry{background-color:transparent}
/* Sternenhimmel (Night): eigene, feststehende Ebene hinter der ganzen App – beim Wischen gleiten nur die Seiten darüber */
#sky{position:fixed;left:0;right:0;top:-80px;bottom:-80px;z-index:-1;pointer-events:none;display:none}
#sky canvas{display:block;width:100%;height:100%}
body:is(.starry,.beach,.aurora,.autumn) #sky{display:block}
body:is(.starry,.beach,.aurora,.autumn) .peek{background:transparent}
body:is(.starry,.beach,.aurora,.autumn) #crumbbar{background:color-mix(in srgb,var(--paper) 55%,transparent);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)} /* Pfadleiste lässt den Design-Hintergrund durchscheinen */
body.tinted.m-dark{ --accent-text:color-mix(in oklab,var(--accent) 62%,#FFFFFF); --tp:26%; --ts:30%; --ts2:36%; --tl:46%; --ti:14%;
  --muted:color-mix(in oklab,var(--accent) 50%,var(--b-ink)); --ink-2:color-mix(in oklab,var(--accent) 30%,var(--b-ink));
  --accent-soft:color-mix(in oklab,var(--accent) 35%,var(--surface)); }
body{
  --accent-text:var(--accent);
  --paper:color-mix(in oklab,var(--accent) var(--tp),var(--b-paper));
  --surface:color-mix(in oklab,var(--accent) var(--ts),var(--b-surface));
  --surface-2:color-mix(in oklab,var(--accent) var(--ts2),var(--b-surface-2));
  --line:color-mix(in oklab,var(--accent) var(--tl),var(--b-line));
  --muted:color-mix(in oklab,var(--accent) var(--tm),var(--b-muted));
  --ink:color-mix(in oklab,var(--accent) var(--ti),var(--b-ink));
  --ink-2:color-mix(in oklab,var(--accent) calc(var(--ti) + 4%),var(--b-ink-2));
  --accent-soft:color-mix(in oklab,var(--accent) 15%,var(--surface));
  --seq1:color-mix(in oklab,var(--accent) 22%,var(--surface)); --seq2:color-mix(in oklab,var(--accent) 55%,var(--surface));
  --seq3:var(--accent); --seq4:color-mix(in oklab,var(--accent) 60%,var(--ink));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16.5px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* Langes Drücken markiert/kopiert nichts – außer in Eingabefeldern und beim Text der Karten */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.flash-face,.flash-face *,.exam-miss div,.exam-miss small{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Layout */
#app{min-height:100%}
#main{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
@media (min-width:900px){ #main{padding:32px 36px 120px} }
body.studying #tabs{display:none!important}

.peek{position:fixed;inset:0;z-index:5;visibility:hidden;will-change:transform;backface-visibility:hidden;contain:layout paint;background:var(--paper);overflow:hidden;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + var(--tc))}
.peek .pg{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
@media (min-width:900px){ .peek .pg{padding:32px 36px 120px} }
html,body{overflow-x:clip}
body.studying #main{max-width:760px;padding-bottom:24px}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;transition:none;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
#tabs button.on{color:var(--accent-text)}
#tabs svg{width:24px;height:24px;stroke-width:1.6;transform:scale(.84);transition:stroke-width .15s ease,transform .15s ease}
#tabs button.on svg{stroke-width:2.9;transform:none}
#tabs button.on span{font-weight:800}
@media (prefers-reduced-motion:reduce){#tabs svg{transition:none}}
@media (min-width:700px){
  #tabs{left:50%;right:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:400px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px 8px}
}
#tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;border-radius:99px;padding:1px 6px}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{min-width:0}
@media (max-width:599px){.topbar .pill-sync{display:none}}
.topbar h1{font-size:33px;font-weight:800}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14.5px;color:var(--muted);margin-bottom:10px}
/* Ordnerpfad: fest oben am Bildschirm (eigene Leiste #crumbbar außerhalb des scrollenden Inhalts) – bewegt sich weder beim Scrollen noch beim Nachfedern.
   Im Inhalt bleibt ein unsichtbarer Platzhalter gleicher Höhe. */
#main > .crumbs{visibility:hidden;margin:-18px -16px 2px;padding:18px 16px 8px}
@media (min-width:900px){ #main > .crumbs{margin:-32px -36px 2px;padding:32px 36px 8px} }
#crumbbar{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--tc));z-index:20;background:var(--paper);transition:box-shadow .2s ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#crumbbar[hidden]{display:none}
#crumbbar .crumbs{max-width:1120px;margin:0 auto;padding:18px 16px 8px}
@media (min-width:900px){ #crumbbar .crumbs{padding:32px 36px 8px} }
#crumbbar.stuck{box-shadow:0 1px 0 var(--line),0 8px 16px -12px rgba(0,0,0,.35)}
.crumbs button{color:var(--muted);font-weight:600;padding:2px 4px;border-radius:6px}
.crumbs button:hover{color:var(--ink);background:var(--surface)}
.pill-sync{font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill-sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.pill-sync.local i{background:var(--hard)}


/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)} /* wie die anderen Kacheln: ohne Rahmen, mit Schatten */
.stat b{display:block;font:800 26.5px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:16px 18px;margin-bottom:26px;text-align:left}
.cta b{font:800 21px var(--display)}
.cta small{display:block;opacity:.7;font-size:14.5px}
.cta .go{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:9px 16px;font-weight:700;white-space:nowrap}
.cta:disabled{opacity:.55}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 12px}
.sec-h h2{font-size:21px;font-weight:800}
.sec-h .muted{font-size:14.5px}
.csort-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}

/* Folder tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-bottom:28px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.tile{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile-main{display:block;width:100%;text-align:left}
.tile,.frow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.rd-box{position:relative}
.rd-src{opacity:.28}
.rd-src.tile{box-shadow:none;outline:2px dashed var(--line);outline-offset:-2px}
.rd-ghost{position:fixed;z-index:90;margin:0;pointer-events:none;will-change:transform;transition:box-shadow .18s ease!important;animation:none!important;border-radius:var(--r);background:var(--surface);opacity:.97}
.rd-ghost.drop{transition:transform .22s cubic-bezier(.2,.8,.25,1),box-shadow .22s ease!important}
.rd-ghost.lift{box-shadow:0 22px 50px rgba(0,0,0,.28),0 0 0 1px var(--line)}
.rd-box>.tile,.rd-box>.frow{transition:none}
@keyframes rdWig{0%{rotate:-1.3deg}50%{rotate:1.3deg}100%{rotate:-1.3deg}}
@keyframes rdWigS{0%{rotate:-.35deg}50%{rotate:.35deg}100%{rotate:-.35deg}}
.rd-box>.tile:not(.rd-src){animation:rdWig .3s ease-in-out infinite}
.rd-box>.tile:not(.rd-src):nth-child(2n){animation-duration:.34s;animation-delay:-.17s}
.rd-box>.tile:not(.rd-src):nth-child(3n){animation-duration:.32s;animation-delay:-.08s}

/* Titelbild: oben scharf (::after, nur im Bildbereich). Unten (::before) läuft genau dieses sichtbare Bild gespiegelt und

   Darüber im unteren Teil ein Farbschleier je nach Transparenz: stark = deutlich durchscheinend, leicht = etwas, keine = deckend */
.cvw{position:relative;isolation:isolate;overflow:hidden;overflow:clip; /* clip: nur abschneiden, nicht verschiebbar (sonst rutscht der Inhalt beim Antippen hoch) */--cvo:80%;--cvb:18px}

.set-group{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:18px;max-width:720px}
.set-group h2{font-size:20px;font-weight:800;margin-bottom:2px}
.set-group>p{margin:0 0 14px;color:var(--muted);font-size:15.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:10px;font-weight:700;font-size:15.5px;color:var(--muted)}
.seg button svg{width:18px;height:18px;flex:none}
@media (max-width:440px){.seg button{font-size:14.5px;gap:5px;padding:10px 2px}.seg button svg{width:16px;height:16px}}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:14px 8px}
.theme{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;border-radius:14px;color:var(--muted);font-size:14.5px;font-weight:600}
.theme-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--tb);color:var(--tf);box-shadow:inset 0 0 0 1px rgba(128,128,128,.22);transition:transform .15s ease,box-shadow .15s ease}
.theme-ic svg{width:24px;height:24px}
/* Thema-Knöpfe: flache, leuchtende Kugeln (Farbverlauf + farbiges Leuchten), Auswahl mit Ring in Themenfarbe */
.themes{grid-template-columns:repeat(4,1fr);gap:18px 6px;padding-top:4px}
.theme .theme-ic{width:58px;height:58px;position:relative;color:var(--tf);
  background:radial-gradient(120% 120% at 30% 20%,color-mix(in oklab,var(--tb) 55%,white) 0,var(--tb) 45%,color-mix(in oklab,var(--tb) 70%,black) 100%);
  box-shadow:0 8px 22px -8px color-mix(in oklab,var(--tb) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .25s cubic-bezier(.34,1.45,.55,1),box-shadow .2s ease}
.theme .theme-ic svg{width:24px;height:24px}
.theme:is([data-v="light"],[data-v="dark"],[data-v="auto"]) .theme-ic{background:var(--tb);box-shadow:0 6px 18px -8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(128,128,128,.22)}
.theme.on .theme-ic{transform:scale(1.06);box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px color-mix(in oklab,var(--tb) 72%,var(--ink)),0 10px 26px -6px color-mix(in oklab,var(--tb) 90%,transparent)}
.theme:not([data-v="light"]):not([data-v="dark"]):not([data-v="auto"]):not(.deco) .theme-ic svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.28))} /* weißes Symbol bleibt auch auf hellen Farben (z. B. Sunshine) lesbar */
.theme.deco .theme-ic{background:var(--orb);box-shadow:0 8px 22px -8px color-mix(in oklab,var(--tb) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.theme.deco .theme-ic::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(90% 60% at 32% 18%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.theme.deco .theme-ic svg{position:relative;z-index:1;stroke-width:2.3;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.55)) drop-shadow(0 1px 1px rgba(0,0,0,.35))} /* bunte Symbole mit hellem Saum → heben sich vom Szenen-Hintergrund ab */
.theme.deco.on .theme-ic{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px color-mix(in oklab,var(--tb) 72%,var(--ink)),0 10px 26px -6px color-mix(in oklab,var(--tb) 90%,transparent)}
.theme.on:is([data-v="light"],[data-v="dark"],[data-v="auto"]) .theme-ic{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--ink),0 6px 18px -8px rgba(0,0,0,.45)}
.theme:active .theme-ic{transform:scale(.92);transition-duration:.08s}
.theme.on{color:var(--ink);font-weight:700}
.theme:active{transform:none}
@media (prefers-reduced-motion:reduce){.theme-ic,.theme .theme-ic{transition:none}}
.set-row{display:flex;align-items:center;gap:10px;font-size:15.5px}
.set-row i{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.set-row.local i{background:var(--hard)}
.flist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:28px}
.frow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow:hover{background:color-mix(in oklab,var(--ink) 4%,transparent)}
.frow-ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:23px;background-size:cover;background-position:center}
.frow-t{flex:1;min-width:0;display:flex;flex-direction:column}
.frow-t b{font:800 18px/1.2 var(--display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow-t span{font-size:12px;font-weight:500;color:var(--muted);margin-top:1px;opacity:.85}
.frow-due{font-size:13px;font-weight:700;color:var(--accent-text);white-space:nowrap}
.frow-ch{color:var(--muted);font-size:24px;line-height:1}
/* ---------- Standard animations (deutlich spürbar) ---------- */
@keyframes aFade{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes aPush{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes aPop{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes aItem{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:none}}
#main.a-fade{animation:aFade .42s cubic-bezier(.16,1,.3,1)}
#main.a-push{animation:aPush .46s cubic-bezier(.16,1,.3,1)}
#main.a-pop{animation:aPop .46s cubic-bezier(.16,1,.3,1)}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel,.banner,.sect .sec-h){animation:aItem .55s cubic-bezier(.34,1.45,.55,1) both}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(2){animation-delay:.06s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(3){animation-delay:.12s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(4){animation-delay:.18s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(5){animation-delay:.24s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(6){animation-delay:.3s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(n+7){animation-delay:.34s}
/* press feedback */
.tile{transition:transform .22s cubic-bezier(.34,1.45,.55,1)}
.tile:active{transform:scale(.93);transition-duration:.08s}
:is(.frow,.card-main,.btn,.icon-btn,.sect-btn,.set-item,.grade,.theme,#tabs button,#menu button,.cta,.learn-btn,.exam-btn){transition:transform .22s cubic-bezier(.34,1.45,.55,1),background .15s ease,color .15s ease}
:is(.frow,.card-main,.btn,.icon-btn,.sect-btn,.set-item,.grade,.theme,#tabs button,#menu button,.cta,.learn-btn,.exam-btn):active{transform:scale(.92);transition-duration:.08s}
/* tab icon bounce when page changes */
@keyframes tabPop{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
/* menu, sheet, toast */
@keyframes menuIn{from{opacity:0;transform:translateY(-14px) scale(.8)}to{opacity:1;transform:none}}
#menu:not([hidden]){animation:menuIn .3s cubic-bezier(.34,1.45,.55,1);transform-origin:top right}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(70%);opacity:.5}to{transform:none;opacity:1}}
@keyframes sheetOut{from{transform:none;opacity:1}to{transform:translateY(60%);opacity:0}}
#sheet:not([hidden]){animation:fadeIn .25s ease}
#sheet:not([hidden]) .sheet{animation:sheetIn .45s cubic-bezier(.16,1,.3,1)}
#sheet.closing{animation:fadeOut .24s ease forwards}
#sheet.closing .sheet{animation:sheetOut .24s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
#toast div{animation:toastIn .45s cubic-bezier(.34,1.45,.55,1)}
/* study */
@keyframes cardIn{from{opacity:0;transform:translateX(140px) rotate(7deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes flipPop{0%{transform:perspective(900px) rotateX(28deg) scale(.95)}60%{transform:perspective(900px) rotateX(-6deg) scale(1.01)}100%{transform:none}}
.flash.card-in{animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
.chev{transition:transform .3s cubic-bezier(.34,1.45,.55,1)}
@media (prefers-reduced-motion:reduce){
  #main[class*="a-"],#main[class*="a-"] *,#menu,#sheet,#sheet .sheet,#toast div,.flash,#tabs svg{animation:none!important}
  :is(.tile,.frow,.card-main,.btn,.icon-btn,.sect-btn,.set-item,.grade,.theme,#tabs button,#menu button,.cta):active{transform:none}
}
/* grade feedback */
@keyframes out0{0%{transform:none}15%{transform:translateX(-14px) rotate(-2deg)}30%{transform:translateX(12px) rotate(2deg)}45%{transform:translateX(-8px)}60%{transform:translateX(5px);opacity:1}100%{transform:translateY(40px) scale(.9);opacity:0}}
@keyframes out1{0%{transform:none}35%{transform:rotate(-2.5deg) translateY(4px)}100%{transform:translate(-60px,50px) rotate(-8deg) scale(.92);opacity:0}}
@keyframes out2{0%{transform:none}25%{transform:scale(1.02)}100%{transform:translateX(120%) rotate(10deg);opacity:0}}
@keyframes out3{0%{transform:none}25%{transform:scale(1.04) translateY(-6px)}100%{transform:translate(90%,-70%) rotate(16deg) scale(.85);opacity:0}}
.flash[class*="out-g"],.flash.tint{pointer-events:none}
.flash.tint{border-top-color:var(--gc);box-shadow:0 0 0 4px var(--gc),var(--shadow)}
.flash.out-g0{animation:out0 .52s ease-in forwards;box-shadow:0 0 0 3px var(--g-again),var(--shadow)}
.flash.out-g1{animation:out1 .44s cubic-bezier(.5,0,.75,0) forwards;box-shadow:0 0 0 3px var(--g-hard),var(--shadow)}
.flash.out-g2{animation:out2 .44s cubic-bezier(.5,0,.75,0) forwards;box-shadow:0 0 0 3px var(--g-good),var(--shadow)}
.flash.out-g3{animation:out3 .44s cubic-bezier(.5,0,.75,0) forwards;box-shadow:0 0 0 3px var(--g-easy),0 0 40px color-mix(in oklab,var(--g-easy) 45%,transparent)}
.flash.out-g0{border-top-color:var(--g-again);box-shadow:0 0 0 4px var(--g-again),var(--shadow)}
.flash.out-g1{border-top-color:var(--g-hard);box-shadow:0 0 0 4px var(--g-hard),var(--shadow)}
.flash.out-g2{border-top-color:var(--g-good);box-shadow:0 0 0 4px var(--g-good),var(--shadow)}
.flash.out-g3{border-top-color:var(--g-easy);box-shadow:0 0 0 4px var(--g-easy),0 0 40px color-mix(in oklab,var(--g-easy) 45%,transparent)}
.grade.chosen{background:var(--g);color:#111318}
.grade.chosen small{color:rgba(17,19,24,.7)}
.grade-fx{position:fixed;left:50%;top:42%;z-index:80;pointer-events:none;width:0;height:0}
.gfx-badge{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:var(--gc);color:#111318;font-weight:800;font-size:20px;padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px color-mix(in oklab,var(--gc) 45%,transparent);white-space:nowrap}
.gfx-badge b{font-size:24px;line-height:1}
@keyframes fx0{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(-4deg)}35%{transform:translate(-50%,-50%) rotate(4deg)}50%{transform:translate(-50%,-50%) rotate(-3deg)}70%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(-50%,-40%) scale(.9)}}
@keyframes fx1{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30%) scale(.95)}}
@keyframes fx2{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}45%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
@keyframes fx3{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(3deg)}45%{transform:translate(-50%,-50%) scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%) scale(1.05)}}
.grade-fx.g0 .gfx-badge{animation:fx0 1s ease forwards}
.grade-fx.g1 .gfx-badge{animation:fx1 .95s ease forwards}
.grade-fx.g2 .gfx-badge{animation:fx2 .95s cubic-bezier(.2,.8,.25,1) forwards}
.grade-fx.g3 .gfx-badge{animation:fx3 1s cubic-bezier(.2,.8,.25,1) forwards}
.grade-fx i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--gc);animation:spark .8s cubic-bezier(.2,.8,.25,1) forwards}
.grade-fx i:nth-child(3n){background:var(--g-hard)}
.grade-fx i:nth-child(4n){background:var(--g-good)}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.4)}}
.learn-btn{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border-radius:16px;background:var(--accent);color:var(--accent-ink);text-align:left;box-shadow:0 8px 22px color-mix(in oklab,var(--accent) 35%,transparent)}
.learn-btn:hover{filter:brightness(1.06)}
.lb-play{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--accent-ink) 18%,transparent);flex:none}

.lb-t{display:flex;flex-direction:column}

.lb-t span{font-size:14.5px;opacity:.85}
.exam-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;--g:var(--muted);background:color-mix(in oklab,var(--g) 16%,var(--surface));color:color-mix(in oklab,var(--g) 82%,var(--ink));border:2px solid color-mix(in oklab,var(--g) 70%,transparent);font-weight:800;font-size:16.5px;box-shadow:0 4px 14px color-mix(in oklab,var(--g) 18%,transparent)}

/* Login */

async function shrinkImage(file, max, q){

/* ---------- Kartendecks teilen (Stufe 1: Kopie per Link) ----------
   Der Besitzer lädt einen Schnappschuss (Ordner + Unterordner + Kartentext, ohne Lernstand) in die Tabelle shared_decks.
   Wer den Link öffnet, sieht – auch ohne Konto – eine Vorschau und kann sich eine eigene, frei änderbare Kopie holen. */
const SHARE_BASE = "https://cardo-app.github.io/Cardo/";
const SHARED_IN = (() => { try { const q = new URLSearchParams(location.search), id = q.get("deck");
  if (id && /^[A-Za-z0-9]{10,24}$/.test(id)) { q.delete("deck"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); return id; } } catch {} return null; })();
const shareLink = id => SHARE_BASE + "?deck=" + id;
function newShareId(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", b = crypto.getRandomValues(new Uint8Array(12)); return [...b].map(x => a[x % a.length]).join(""); }
const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(String(c || "")) ? c : "#FF5A36";
const safeCover = c => typeof c === "string" && c.length < 400000 && (/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(c) || /^https:\/\//i.test(c)) ? c : "";
function deckSnapshot(fid){
  const folders = [], cards = [], idx = {};
  const walk = (id, parent) => { const f = S.folders[id]; if (!f) return; const k = folders.length; idx[id] = k;
    const o = { k, p: parent, n: f.name, e: f.emoji ?? "", c: safeColor(f.color) }; const cv = safeCover(f.cover); if (cv) { o.cv = cv; if (f.cpos) o.cp = cposOf(f); } if (f.side) o.sd = f.side; if (f.csort) o.cs = f.csort;

    Object.values(S.decks[id] || {}).sort((a, b) => (a.created || 0) - (b.created || 0)).forEach(c => cards.push([k, c.f, c.b]));
    children(id).forEach(ch => walk(ch.id, k)); };

}
const canShare = () => !!(SB && USER && S.mode !== "local");

// QR-Code: Bibliothek erst beim ersten Bedarf laden; ohne Netz einfach weglassen
let qrLib = null;
function qrInto(box, text){
  if (!box) return;
  const draw = () => { try { const q = window.qrcode(0, "M"); q.addData(text); q.make(); const n = q.getModuleCount(), m = 2; let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
      box.innerHTML = `<svg viewBox="0 0 ${n + m * 2} ${n + m * 2}" shape-rendering="crispEdges" role="img" aria-label="QR-Code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#111"/></svg><span>Zum Scannen mit der Kamera</span>`; }
    catch (e) { box.remove(); } };
  if (window.qrcode) return draw();
  qrLib = qrLib || new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  qrLib.then(() => box.isConnected && draw(), () => { qrLib = null; box.remove(); });
}

async function importSharedDeck(d){
  const snap = d.data, map = {}, entries = [], now = Date.now();
  const tops = children(null), taken = new Set(tops.map(f => f.name));
  let name = snap.folders[0].n, i = 2; while (taken.has(name)) name = `${snap.folders[0].n} (${i++})`;
  const kidsOrder = {};
  snap.folders.forEach((x, n) => {
    const id = uid() + n.toString(36); map[x.k] = id;
    const parentId = x.p >= 0 ? map[x.p] : null;
    const order = x.p >= 0 ? (kidsOrder[x.p] = (kidsOrder[x.p] ?? -1) + 1) : tops.reduce((m, f) => Math.max(m, f.order || 0), -1) + 1;
    const f = { id, name: x.p >= 0 ? String(x.n || "Ordner") : name, emoji: String(x.e ?? ""), color: safeColor(x.c), parentId, order, created: now + n, from: d.id };
    const cv = safeCover(x.cv); if (cv) { f.cover = cv; if (Array.isArray(x.cp)) f.cpos = cposOf({ cpos: x.cp }); } if (["front","both","back"].includes(x.sd)) f.side = x.sd; if (typeof x.cs === "string") f.csort = x.cs;
    entries.push(["folders/" + id, f]);
  });
  const deckOf = {}; (snap.cards || []).forEach((c, n) => { const fid = map[c[0]]; if (!fid) return; const id = uid() + "c" + n.toString(36);
    (deckOf[fid] = deckOf[fid] || {})[id] = { id, f: String(c[1] || ""), b: String(c[2] || ""), due: now, ivl: 0, ease: 2.5, reps: 0, lapses: 0, created: now + n }; });
  Object.entries(deckOf).forEach(([fid, cards]) => entries.push(["cards/" + fid, { cards }]));
  await applyEntries(entries);
  return map[snap.folders[0].k];
}
async function addSharedDeck(id, btn){
  if (btn) { btn.disabled = true; btn.textContent = "Wird hinzugefügt …"; }
  try {
    const d = await fetchSharedDeck(id); if (!d) throw new Error("not found");
    const until = Date.now() + 15000; while (!(S.loaded.f && S.loaded.c) && Date.now() < until) await new Promise(r => setTimeout(r, 150));
    const root = await importSharedDeck(d);
    try { localStorage.removeItem("cardo-pending-deck"); } catch {}

  } catch (e) { console.warn(e); if (btn) { btn.disabled = false; btn.textContent = "Zu meiner Bibliothek hinzufügen"; } toast("Hinzufügen hat nicht geklappt. Versuch es noch einmal."); }
}

/* ---------- Login ---------- */
function authErr(e){
  const m = String((e && e.message) || e || "");
  if (/Invalid login credentials/i.test(m)) return "E-Mail oder Passwort stimmt nicht.";
  if (/Email not confirmed/i.test(m)) return "Bitte bestätige zuerst deine E-Mail-Adresse über den Link in der Bestätigungsmail.";
  if (/already registered|already exists/i.test(m)) return "Für diese E-Mail gibt es schon ein Konto. Melde dich an.";
  if (/Password should be at least|weak/i.test(m)) return "Das Passwort muss mindestens 6 Zeichen haben.";
  if (/rate limit|too many/i.test(m)) return "Zu viele Versuche. Warte kurz und probier es dann erneut.";
  if (/fetch|network/i.test(m)) return "Keine Verbindung. Prüfe dein Internet.";
  return m || "Das hat nicht geklappt.";

    const good = Math.max(hard + 1, Math.round(c.ivl * c.ease));
    const easy = Math.max(good + 1, Math.round(c.ivl * (c.ease + 0.15) * 1.3));
    if (g === 1) { c.ease = Math.max(1.3, c.ease - 0.15); c.ivl = hard; }
    else if (g === 2) { c.ivl = good; }

}

const BK_KEEP = 4, BK_EVERY = 7 * DAY, EXPORT_REMIND = 30 * DAY;

}

/* ---------- Study ---------- */
/* Lernrichtung pro Ordner (gilt auch für Unterordner, solange diese nichts Eigenes eingestellt haben):
   front = Vorderseite zuerst · both = beidseitig (zufällig gemischt) · back = Rückseite zuerst. Altes Feld „both“ wird mitgelesen. */
const SIDES = [["front", "Vorderseite zuerst", "Vorne → hinten"], ["both", "Beidseitig (gemischt)", "Zufällig mal so, mal so"], ["back", "Rückseite zuerst", "Hinten → vorne"]];
function sideOf(fid){ const p = pathOf(fid); for (let i = p.length - 1; i >= 0; i--) { const x = p[i]; if (SIDES.some(o => o[0] === x.side)) return x.side; if (typeof x.both === "boolean") return x.both ? "both" : "front"; } return "front"; }
const bothSided = fid => sideOf(fid) === "both";
const pickSide = fid => { const sd = sideOf(fid); return sd === "back" || (sd === "both" && Math.random() < .5); };
function setSide(fid, side){
  const f = S.folders[fid]; if (!f || !SIDES.some(o => o[0] === side)) return;
  const y = { ...f, side }; delete y.both; putFolder(y);
  descendants(fid).forEach(id => { const x = S.folders[id]; if (x && (x.side || typeof x.both === "boolean")) { const z = { ...x }; delete z.side; delete z.both; putFolder(z); } });
  toast("Lernrichtung: " + SIDES.find(o => o[0] === side)[1]); render();
}
/* Kartenreihenfolge pro Ordner (nur Anzeige in der Liste und „Der Reihe nach“ beim Prüfen) */
const CSORTS = [["added", "Wie hinzugefügt"], ["new", "Neueste zuerst"], ["az", "Alphabetisch (A–Z)"], ["za", "Alphabetisch (Z–A)"]];
const csortOf = fid => { const f = S.folders[fid]; return f && CSORTS.some(o => o[0] === f.csort) ? f.csort : "added"; };
const abc = (x, y) => String(x || "").localeCompare(String(y || ""), "de", { numeric: true, sensitivity: "base" });
function cardSorter(fid){
  const k = csortOf(fid), t = c => c.created || 0;
  if (k === "new") return (a, b) => t(b) - t(a);
  if (k === "az") return (a, b) => abc(a.f, b.f) || abc(a.b, b.b) || t(a) - t(b);
  if (k === "za") return (a, b) => abc(b.f, a.f) || abc(b.b, a.b) || t(a) - t(b);
  return (a, b) => t(a) - t(b);
}
function openCardSortMenu(btn, fid){

async function makeCover(file){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = AS ? 1100 : 640, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", AS ? .84 : .74));
  if (AS) { try { const r = await AS.upload(blob, { type: "image/jpeg" }); return "asset:" + r.id; } catch (e) { console.warn("upload", e); } }
  return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
}

function cleanHtml(s){
  s = s.replace(/<(b|strong)>([\s\S]*?)<\/\1>/gi, (m, t, x) => x.trim() ? "**" + x.trim() + "**" : x).replace(/<(i|em)>([\s\S]*?)<\/\1>/gi, (m, t, x) => x.trim() ? "*" + x.trim() + "*" : x)
    .replace(/<li[^>]*>/gi, "- ").replace(/\\\[([\s\S]*?)\\\]/g, "$$$$$1$$$$");
  return s.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(div|p|li)>/gi, "\n").replace(/<[^>]+>/g, "")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/\[sound:[^\]]*\]/g, "").replace(/\n{3,}/g, "\n\n").trim();
}
function parseRows(text, sep, header){
  text = text.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  text = text.split("\n").filter(l => !/^#\w+:/.test(l)).join("\n");
  if (sep === "auto") { const s = text.slice(0, 3000); sep = s.includes("\t") ? "\t" : s.includes(";") ? ";" : s.includes(" - ") ? " - " : s.includes("|") ? "|" : ","; }
  let rows = [];
  if (sep.length > 1 || sep === "|") {
    rows = text.split("\n").map(l => { const i = l.indexOf(sep); return i < 0 ? null : [l.slice(0, i), l.slice(i + sep.length)]; }).filter(Boolean);
  } else {
    let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell === "") q = true;
      else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
  }
  if (header) rows.shift();
  return { sep, rows: rows.map(r => [cleanHtml(r[0] || ""), cleanHtml(r[1] || "")]).filter(r => r[0] && r[1]) };
}

/* Menü immer ganz sichtbar: unter dem Knopf, sonst darüber, sonst so weit hoch wie nötig (und notfalls scrollbar) – nie unter die Tab-Leiste oder aus dem Bildschirm */
function placeMenu(m, btn){
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, tb = $("#tabs"), tr = tb && tb.offsetParent ? tb.getBoundingClientRect() : null;
  const minTop = (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0) + 8, maxBot = (tr && tr.top < innerHeight ? tr.top : innerHeight) - 8;
  m.style.maxHeight = Math.max(120, maxBot - minTop) + "px"; const h = m.offsetHeight;
  let top, up = false;
  if (r.bottom + 6 + h <= maxBot) top = r.bottom + 6;
  else if (r.top - 6 - h >= minTop) { top = r.top - 6 - h; up = true; }
  else { top = Math.max(minTop, maxBot - h); up = r.top > (minTop + maxBot) / 2; }
  /* breite Menüs (über 70 % der Bildschirmbreite) mittig, kleine bleiben seitlich am Knopf */
  const wide = w > innerWidth * .7;
  m.style.top = top + "px"; m.style.left = (wide ? Math.round((innerWidth - w) / 2) : Math.max(8, Math.min(innerWidth - w - 8, r.right - w))) + "px";
  m.style.transformOrigin = (up ? "bottom " : "top ") + (wide ? "center" : "right");
}

document.addEventListener("contextmenu", e => { const r = cmRow(e.target); if (!r) return; e.preventDefault(); if (CM.until > Date.now()) return; CM.row = r; cmOpen(e.clientX, e.clientY); });
document.addEventListener("click", e => { if (Date.now() < CM.until && e.target.closest && e.target.closest(".card-row")) { e.preventDefault(); e.stopPropagation(); CM.until = 0; } }, true);
document.addEventListener("selectstart", e => { if (cmRow(e.target)) e.preventDefault(); });

// Two-finger swipe on a Mac trackpad
let wAcc = 0, wLock = 0, wT = 0;
document.addEventListener("wheel", e => {
  if (!canSwipe() || e.ctrlKey) return;
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || e.target.closest("#czoom")) return;
  const now = Date.now(); if (now < wLock) return;
  if (now - wT > 250) wAcc = 0; wT = now; wAcc += e.deltaX;
  if (Math.abs(wAcc) < 90) return;
  const dir = wAcc > 0 ? "left" : "right"; wAcc = 0; wLock = now + 700;
  if (animating) settleSwipe();
  if (!neighbour(dir)) return;
  if (reduceMotion.matches) { go(neighbour(dir), neighbour(dir) === "lib" ? libTarget() : null); return; }
  showPeek(dir); place(0, 0); $("#main").style.willChange = "transform"; document.body.classList.add("swiping");
  requestAnimationFrame(() => finish(true, dir, 1.4));
}, { passive: true });

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#cmenu:not(.closing)")) { cmClose(); return; }
  if (e.key === "Escape" && $("#czoom")) { closeChartZoom(); return; }
  if ((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.matches(".zoomable")) { e.preventDefault(); chartZoom(document.activeElement.dataset.id || null); return; }
  if (e.key === "Escape" && !$("#menu").hidden) { closeMenu(); return; }
  if (e.key === "Escape" && !$("#sheet").hidden) { closeSheet(); return; }
  if (S.view !== "study" || !$("#sheet").hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable || $("#mathsheet")) return;
  if ((e.key === " " || e.key === "Enter") && S.study && !S.study.flipped) { e.preventDefault(); S.study.flipped = true; S.study.justFlipped = true; render(); }
  else if (/^[1-4]$/.test(e.key) && S.study && S.study.flipped && +e.key <= curGrades().length) { e.preventDefault(); grade(+e.key - 1); }
  else if ((e.key === "e" || e.key === "E") && !e.metaKey && !e.ctrlKey) { const c = curCard(); if (c && !S.study.busy) { e.preventDefault(); cardSheet(c.fid, c.id); } }
  else if ((e.key === "z" || e.key === "Z" || e.key === "Backspace") && !e.altKey) { e.preventDefault(); undoGrade(); }
  else if (e.key === "Escape") endStudy();
});

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
addEventListener("online", () => render()); addEventListener("offline", () => render());
// Merken, ob die Seite überhaupt scrollbar ist (dann darf sie am Rand weich nachfedern)
function updScroll(){
  // Maßgeblich ist, wo der Inhalt wirklich endet – nicht die Dokumenthöhe (die ist in der installierten iOS-App wegen 100lvh größer als der Bildschirm)
  const r = document.documentElement, m = $("#main"); if (!m) return;
  const need = m.getBoundingClientRect().bottom + scrollY > innerHeight + 2;
  r.classList.toggle("can-scroll", need); r.classList.toggle("no-scroll", !need);
  if (!need && scrollY) window.scrollTo(0, 0);
}
addEventListener("resize", updScroll);
// Ordnerpfad in die feste Leiste spiegeln; Schatten, sobald Inhalt darunter durchläuft
function updCrumbs(){
  let bar = $("#crumbbar"); if (!bar) { bar = document.createElement("div"); bar.id = "crumbbar"; bar.hidden = true; document.body.appendChild(bar); }
  const src = document.querySelector("#main > .crumbs");
  if (!src || S.view !== "lib") { if (!bar.hidden) bar.hidden = true; return; }
  const h = src.outerHTML; if (bar._h !== h) { bar.innerHTML = h; bar._h = h; }
  if (bar.hidden) { bar.style.transition = "none"; bar.style.transform = $("#main").style.transform || ""; bar.hidden = false; }
  bar.classList.toggle("stuck", scrollY > 6);
}
addEventListener("scroll", updCrumbs, { passive: true });
if (window.MutationObserver) new MutationObserver(updCrumbs).observe($("#main"), { childList: true });
if (window.ResizeObserver) new ResizeObserver(updScroll).observe($("#main"));
try { history.scrollRestoration = "manual"; } catch {} window.scrollTo(0, 0); // Bibliothek öffnet immer oben
// Nach längerer Pause (App im Hintergrund) die Bibliothek wieder oben zeigen
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 60000 && S.view === "lib" && $("#sheet").hidden) window.scrollTo(0, 0); });
requestAnimationFrame(() => setTimeout(boot, 0)); // erst ein Bild zeichnen, damit die Startanimation schon auf der Grafikkarte läuft
})();
</script>
