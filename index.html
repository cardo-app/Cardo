body.neutral{ --accent-soft:color-mix(in oklab,var(--accent) 9%,var(--surface)); }

body.tinted.m-dark{ --accent-text:color-mix(in oklab,var(--accent) 62%,#FFFFFF); --tp:26%; --ts:30%; --ts2:36%; --tl:46%; --ti:14%;
  --muted:color-mix(in oklab,var(--accent) 50%,var(--b-ink)); --ink-2:color-mix(in oklab,var(--accent) 30%,var(--b-ink));
  --accent-soft:color-mix(in oklab,var(--accent) 35%,var(--surface)); }
body{
  --accent-text:var(--accent);
  --paper:color-mix(in oklab,var(--accent) var(--tp),var(--b-paper));
  --surface:color-mix(in oklab,var(--accent) var(--ts),var(--b-surface));
  --surface-2:color-mix(in oklab,var(--accent) var(--ts2),var(--b-surface-2));
  --line:color-mix(in oklab,var(--accent) var(--tl),var(--b-line));
  --muted:color-mix(in oklab,var(--accent) var(--tm),var(--b-muted));
  --ink:color-mix(in oklab,var(--accent) var(--ti),var(--b-ink));
  --ink-2:color-mix(in oklab,var(--accent) calc(var(--ti) + 4%),var(--b-ink-2));
  --accent-soft:color-mix(in oklab,var(--accent) 15%,var(--surface));
  --seq1:color-mix(in oklab,var(--accent) 22%,var(--surface)); --seq2:color-mix(in oklab,var(--accent) 55%,var(--surface));
  --seq3:var(--accent); --seq4:color-mix(in oklab,var(--accent) 60%,var(--ink));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16.5px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Layout */
#app{min-height:100%}
#main{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
@media (min-width:900px){ #main{padding:32px 36px 120px} }
body.studying #tabs{display:none!important}

.peek{position:fixed;inset:0;z-index:5;visibility:hidden;will-change:transform;backface-visibility:hidden;contain:layout paint;background:var(--paper);overflow:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.peek .pg{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
@media (min-width:900px){ .peek .pg{padding:32px 36px 120px} }
html,body{overflow-x:clip}
body.studying #main{max-width:760px;padding-bottom:24px}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;transition:none;display:flex;justify-content:space-around;background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
#tabs button.on{color:var(--accent-text)}
#tabs svg{width:24px;height:24px;stroke-width:1.6;transform:scale(.84);transition:stroke-width .15s ease,transform .15s ease}
#tabs button.on svg{stroke-width:2.9;transform:none}
#tabs button.on span{font-weight:800}
@media (prefers-reduced-motion:reduce){#tabs svg{transition:none}}
@media (min-width:700px){
  #tabs{left:50%;right:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:400px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px 8px}
}
#tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;border-radius:99px;padding:1px 6px}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{min-width:0}
@media (max-width:599px){.topbar .pill-sync{display:none}}
.topbar h1{font-size:33px;font-weight:800}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14.5px;color:var(--muted);margin-bottom:10px}
.crumbs button{color:var(--muted);font-weight:600;padding:2px 4px;border-radius:6px}
.crumbs button:hover{color:var(--ink);background:var(--surface)}
.pill-sync{font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill-sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.pill-sync.local i{background:var(--hard)}


/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.stat b{display:block;font:800 26.5px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:16px 18px;margin-bottom:26px;text-align:left}
.cta b{font:800 21px var(--display)}
.cta small{display:block;opacity:.7;font-size:14.5px}
.cta .go{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:9px 16px;font-weight:700;white-space:nowrap}
.cta:disabled{opacity:.55}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 12px}
.sec-h h2{font-size:21px;font-weight:800}
.sec-h .muted{font-size:14.5px}

/* Folder tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-bottom:28px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.tile{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile-main{display:block;width:100%;text-align:left}
.art{aspect-ratio:16/11;position:relative;background-color:var(--c,#888);background-size:cover;background-position:center}
.art.col{background-image:radial-gradient(circle at 85% 0%,color-mix(in oklab,var(--c) 45%,white) 0,transparent 60%),radial-gradient(circle at 0% 100%,color-mix(in oklab,var(--c) 70%,black) 0,transparent 55%)}
.art-emoji{position:absolute;left:12px;bottom:10px;font-size:37.5px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.art.has-cover .art-emoji{background:rgba(255,255,255,.92);border-radius:12px;padding:5px;font-size:26.5px}
.due-badge{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;border-radius:99px;padding:3px 9px;box-shadow:var(--shadow)}
.due-badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.tile-body{padding:11px 13px 12px}
.tile-name{font:800 18px/1.2 var(--display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-meta{font-size:12px;font-weight:500;color:var(--muted);margin-top:1px;opacity:.85}
.tile-more{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.9);color:#15171C;font-size:20px;line-height:1;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tile-more svg{width:15px;height:15px}
.tile.add{box-shadow:none;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;min-height:170px;color:var(--muted);font-weight:700}
.tile.add:hover{border-color:var(--accent);color:var(--accent-text)}
.tile.add span{display:block;font-size:33px;text-align:center;line-height:1}

/* Folder banner */
.banner{border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:24px}
.banner .art{aspect-ratio:auto;height:150px}
@media (min-width:700px){.banner .art{height:190px}}
.banner .art-emoji{font-size:50.5px;left:18px;bottom:14px}
.banner.has-cover .art-emoji{font-size:35px}
.banner-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.banner h1{font-size:clamp(27px,7.4vw,35px);hyphens:auto;-webkit-hyphens:auto;font-weight:800;line-height:1.08;letter-spacing:-.02em}
.banner-meta{font-size:12.5px;font-weight:500;margin-top:4px;opacity:.85}
.banner-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.banner-row{flex-wrap:wrap}
.banner-row>div{min-width:0;flex:1 1 220px}
.banner h1{overflow-wrap:break-word}
#menu .sub{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent-text)}
#menu button:disabled{opacity:.45}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15.5px;background:color-mix(in oklab,var(--ink) 5%,transparent);border:1px solid transparent;color:var(--ink-2)}
.btn:hover{background:color-mix(in oklab,var(--ink) 9%,transparent);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:transparent}
.btn.danger{color:var(--again)}
.btn.danger.armed{background:var(--again);color:#fff;border-color:transparent}
.btn.block{width:100%;justify-content:center;padding:13px}

/* Card list */
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.cards{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-row{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;border-top:1px solid var(--line)}
.card-row:first-child{border-top:0}
.card-main{flex:1;min-width:0;text-align:left;padding:12px 0 12px 16px;display:grid;grid-template-columns:1fr;gap:2px}
@media (min-width:700px){.card-main{grid-template-columns:1fr 1fr;gap:18px}}
.cf,.cb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf{font-weight:600}
.cb{color:var(--muted)}
.st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.st.new{color:var(--easy);border-color:color-mix(in oklab,var(--easy) 40%,transparent)}
.st.due{color:var(--accent-text);border-color:color-mix(in oklab,var(--accent) 45%,transparent)}
.st.mature{color:var(--good);border-color:color-mix(in oklab,var(--good) 40%,transparent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17.5px;margin-bottom:4px}
.empty .actions{justify-content:center;margin-top:14px}

/* Learn list */
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.lrow .dot{width:44px;height:44px;border-radius:12px;font-size:24px}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .t span{font-size:14.5px;color:var(--muted)}

/* Study */
.study-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.remind{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px;margin:0 0 18px}
.remind .rm-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.remind .rm-t b{font-size:16px}.remind .rm-t span{font-size:14px;color:var(--muted)}
.remind .rm-x{width:34px;height:34px;flex:none;border-radius:10px;background:none;border:0;color:var(--muted);display:grid;place-items:center}.remind .rm-x svg{width:16px;height:16px}
.bk-row{flex-wrap:wrap;gap:8px}.bk-row .si-t{display:flex;flex-direction:column}.bk-row small{font-size:13.5px;color:var(--muted);font-weight:500}
.bk-acts{display:flex;gap:6px;margin-left:auto}.bk-acts .btn{padding:7px 12px;font-size:14px}.bk-acts .btn.armed{background:var(--danger,#d33);color:#fff;border-color:transparent}
.xbtn svg{width:20px;height:20px;display:block;margin:auto}
.xbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.study-count{font-size:14.5px;font-weight:700;color:var(--muted);min-width:64px;text-align:right}
.flash{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);min-height:min(56vh,480px);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;border-top:8px solid var(--c,var(--accent))}
.rev-tag{margin-left:auto;color:var(--accent-text);background:var(--accent-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.flash-src{font-size:13px;font-weight:700;color:var(--muted);padding:14px 20px 0;display:flex;gap:6px;align-items:center}
.flash-face{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 24px;font-size:var(--fs-card);font-weight:600;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.flash-back{border-top:2px dashed var(--line);font-weight:600;color:var(--card-ink);font-size:var(--fs-card)}
/* Kartentext möglichst hell/kräftig: dunkle Modi reinweiß, helle Modi ungetöntes Schwarz */
body{--card-ink:var(--b-ink)}
body.m-dark{--card-ink:#FFFFFF}
@media (prefers-color-scheme:dark){body:not(.m-light){--card-ink:#FFFFFF}}
.flash .flash-face{color:var(--card-ink)}
/* Nach dem Umdrehen: Vorderseite klein und gedämpft, Rückseite groß und kräftig (ohne Animation) */
.flash.flipped .flash-face:not(.flash-back){flex:0 0 auto;padding:18px 24px 16px;font-size:calc(var(--fs-card) * .68);font-weight:600;color:color-mix(in oklab,var(--ink) 58%,var(--surface))}
.flash.flipped .flash-back{flex:1}
body{--fs-card:clamp(23px,5.8vw,32px);--fs-back:clamp(27px,6.9vw,38px)}
body[data-ts="s"]{--fs-card:clamp(19px,4.8vw,26px);--fs-back:clamp(22px,5.7vw,31px)}
body[data-ts="l"]{--fs-card:clamp(28px,7.2vw,40px);--fs-back:clamp(33px,8.5vw,47px)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flash-back{animation:none}.tile{transition:none}}
.grades{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:15;width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent)}
body.studying #main{padding-bottom:130px}
.flash{min-height:calc(100vh - 260px)}
.tap-hint{text-align:center;font-size:14.5px;color:var(--muted);margin-top:14px}
.grade{border-radius:14px;padding:11px 4px;background:var(--surface);border:2px solid var(--g);color:var(--g);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px}
.grade small{font-weight:600;font-size:13px;color:var(--muted)}
.grade:hover{background:color-mix(in oklab,var(--g) 12%,var(--surface))}
.reveal{margin-top:16px}
.kbd-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
@media (hover:none){.kbd-hint{display:none}}
.done{text-align:center;padding:40px 16px}
.done .big{font-size:70.5px;line-height:1}
.done h1{font-size:33px;margin:12px 0 6px}

/* Stats */
.tiles4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
@media (min-width:700px){.tiles4{grid-template-columns:repeat(4,1fr)}}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 12px;margin-bottom:22px}
.panel h3{font-size:17.5px;font-weight:800;margin-bottom:2px}
.chart-wrap{position:relative;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;height:auto;min-width:420px}
.axis{fill:var(--muted);font-size:12px;font-family:var(--body)}
.gridl{stroke:var(--line);stroke-width:1}
.hit{fill:transparent}
.barm{fill:var(--accent)}
.barm.today{fill:var(--ink)}
g.b:hover .barm{filter:brightness(1.12)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:6px 9px;border-radius:8px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);font-weight:600;margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mrow{display:grid;grid-template-columns:minmax(90px,180px) 1fr 44px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15.5px}
.mrow:first-of-type{border-top:0}
.mrow .nm{display:flex;gap:7px;align-items:center;min-width:0}
.mrow .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stack{display:flex;gap:2px;height:12px}
.stack i{display:block;height:100%;border-radius:4px;min-width:0}
.mrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14.5px}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,18,.42)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#sheet{align-items:center}.sheet{border-radius:24px;padding:14px 24px 24px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@media (min-width:700px){.grab{display:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;min-height:40px}
.sheet-h h2{font-size:23px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
textarea.in{min-height:92px;resize:vertical;line-height:1.4}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.emojis button{height:40px;border-radius:10px;font-size:23px;background:var(--surface-2);border:2px solid transparent}
.emojis button.none{font-size:13px;font-weight:700;color:var(--muted)}
.emojis button.on{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.colorin{width:40px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:2px}
.preview{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-bottom:18px}
.preview .tile{pointer-events:none}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.sheet-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.sheet-foot .r{display:flex;gap:8px;margin-left:auto}
.pv{font-size:14.5px;background:var(--surface-2);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.pv div{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0;border-top:1px solid var(--line)}

  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55) 0,rgba(255,255,255,.2) 25%,rgba(255,255,255,0) 60%),linear-gradient(to bottom,rgba(255,255,255,.1),rgba(0,0,0,.22)),var(--tb);

/* ---------- Standard animations (deutlich spürbar) ---------- */
@keyframes aFade{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes aPush{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes aPop{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes aItem{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:none}}
#main.a-fade{animation:aFade .42s cubic-bezier(.16,1,.3,1)}
#main.a-push{animation:aPush .46s cubic-bezier(.16,1,.3,1)}
#main.a-pop{animation:aPop .46s cubic-bezier(.16,1,.3,1)}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel,.banner,.sect .sec-h){animation:aItem .55s cubic-bezier(.34,1.45,.55,1) both}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(2){animation-delay:.06s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(3){animation-delay:.12s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(4){animation-delay:.18s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(5){animation-delay:.24s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(6){animation-delay:.3s}
#main[class*="a-"] :is(.tile,.frow,.card-row,.set-item,.stat,.panel):nth-child(n+7){animation-delay:.34s}
/* press feedback */
.tile{transition:transform .22s cubic-bezier(.34,1.45,.55,1)}
.tile:active{transform:scale(.93);transition-duration:.08s}
:is(.frow,.card-main,.btn,.icon-btn,.sect-btn,.set-item,.grade,.theme,#tabs button,#menu button,.cta,.learn-btn,.exam-btn){transition:transform .22s cubic-bezier(.34,1.45,.55,1),background .15s ease,color .15s ease}
:is(.frow,.card-main,.btn,.icon-btn,.sect-btn,.set-item,.grade,.theme,#tabs button,#menu button,.cta,.learn-btn,.exam-btn):active{transform:scale(.92);transition-duration:.08s}
/* tab icon bounce when page changes */
@keyframes tabPop{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
#tabs button.pop svg{animation:tabPop .45s cubic-bezier(.34,1.45,.55,1)}
/* menu, sheet, toast */
@keyframes menuIn{from{opacity:0;transform:translateY(-14px) scale(.8)}to{opacity:1;transform:none}}
#menu:not([hidden]){animation:menuIn .3s cubic-bezier(.34,1.45,.55,1);transform-origin:top right}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(70%);opacity:.5}to{transform:none;opacity:1}}
@keyframes sheetOut{from{transform:none;opacity:1}to{transform:translateY(60%);opacity:0}}
#sheet:not([hidden]){animation:fadeIn .25s ease}
#sheet:not([hidden]) .sheet{animation:sheetIn .45s cubic-bezier(.16,1,.3,1)}
#sheet.closing{animation:fadeOut .24s ease forwards}
#sheet.closing .sheet{animation:sheetOut .24s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
#toast div{animation:toastIn .45s cubic-bezier(.34,1.45,.55,1)}
/* study */
@keyframes cardIn{from{opacity:0;transform:translateX(140px) rotate(7deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes flipPop{0%{transform:perspective(900px) rotateX(28deg) scale(.95)}60%{transform:perspective(900px) rotateX(-6deg) scale(1.01)}100%{transform:none}}
.flash.card-in{animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
.chev{transition:transform .3s cubic-bezier(.34,1.45,.55,1)}
@media (prefers-reduced-motion:reduce){
  #main[class*="a-"],#main[class*="a-"] *,#menu,#sheet,#sheet .sheet,#toast div,.flash,#tabs svg{animation:none!important}
  :is(.tile,.frow,.card-main,.btn,.icon-btn,.sect-btn,.set-item,.grade,.theme,#tabs button,#menu button,.cta):active{transform:none}
}
/* grade feedback */
@keyframes out0{0%{transform:none}15%{transform:translateX(-14px) rotate(-2deg)}30%{transform:translateX(12px) rotate(2deg)}45%{transform:translateX(-8px)}60%{transform:translateX(5px);opacity:1}100%{transform:translateY(40px) scale(.9);opacity:0}}

@keyframes out3{0%{transform:none}25%{transform:scale(1.04) translateY(-6px)}100%{transform:translate(90%,-70%) rotate(16deg) scale(.85);opacity:0}}

.flash.out-g0{border-top-color:var(--again);box-shadow:0 0 0 4px var(--again),var(--shadow)}

function authErr(e){
  const m = String((e && e.message) || e || "");
  if (/Invalid login credentials/i.test(m)) return "E-Mail oder Passwort stimmt nicht.";
  if (/Email not confirmed/i.test(m)) return "Bitte bestätige zuerst deine E-Mail-Adresse über den Link in der Bestätigungsmail.";
  if (/already registered|already exists/i.test(m)) return "Für diese E-Mail gibt es schon ein Konto. Melde dich an.";
  if (/Password should be at least|weak/i.test(m)) return "Das Passwort muss mindestens 6 Zeichen haben.";
  if (/rate limit|too many/i.test(m)) return "Zu viele Versuche. Warte kurz und probier es dann erneut.";
  if (/fetch|network/i.test(m)) return "Keine Verbindung. Prüfe dein Internet.";

/* ---------- Tree & counts ---------- */
const children = pid => Object.values(S.folders).filter(f => (f.parentId || null) === (pid || null))
  .sort(folderSort);
const byName = (a,b) => String(a.name).localeCompare(String(b.name), "de", { numeric: true });
function folderSort(a, b){
  if (S.sort === "name") return byName(a, b);
  if (S.sort === "new") return (b.created||0) - (a.created||0) || byName(a, b);
  if (S.sort === "due") return counts(b.id).due - counts(a.id).due || byName(a, b);
  return (a.order||0) - (b.order||0) || byName(a, b);
}
function descendants(id){ const out = []; const walk = p => children(p).forEach(c => { if (!out.includes(c.id)) { out.push(c.id); walk(c.id); } }); walk(id); return out; }
function pathOf(id){ const p = []; let f = S.folders[id], g = 0; while (f && g++ < 40) { p.unshift(f); f = S.folders[f.parentId]; } return p; }
function cardsIn(fid, deep){
  const ids = fid ? [fid, ...(deep ? descendants(fid) : [])] : Object.keys(S.folders);
  const out = []; ids.forEach(i => { const d = S.decks[i]; if (d) Object.values(d).forEach(c => out.push({ fid:i, c })); }); return out;
}
const isDue = (c, now = Date.now()) => (c.due || 0) <= now;
/* ---------- Tageslimit: Karten pro Tag (pro Hauptordner) ---------- */
const isNewCard = c => !c.reps;
function topOf(fid){ let f = S.folders[fid], g = 0; while (f && f.parentId && S.folders[f.parentId] && g++ < 40) f = S.folders[f.parentId]; return f ? f.id : fid; }
const seenIds = top => { const d = ((S.seen||{})[dayKey()] || {})[top]; return d && typeof d === "object" ? d : {}; };
const seenToday = (fid, cid) => !!seenIds(topOf(fid))[cid];
function newQuota(top){ if (newLimit() === 0) return Infinity; const extra = ((S.extraNew||{})[dayKey()] || {})[top] || 0; return Math.max(0, newLimit() + extra - Object.keys(seenIds(top)).length); }
function addExtraNew(fid, n){ const k = dayKey(), t = topOf(fid), day = { ...((S.extraNew||{})[k] || {}) }; day[t] = (day[t] || 0) + n; S.extraNew = { ...S.extraNew, [k]: day }; saveStats(); }
// Heute lernbare Karten je Hauptordner: Karten, die heute schon dran waren und wieder fällig sind, zählen nicht erneut;
// sonst zuerst fällige Wiederholungen (älteste Fälligkeit zuerst), dann neue Karten (älteste zuerst) – bis das Tageslimit erreicht ist.
function todayCards(fid){
  const now = Date.now(), all = cardsIn(fid || null, true), byTop = {};
  all.forEach(x => { const n = isNewCard(x.c); if (n || isDue(x.c, now)) { const t = topOf(x.fid); (byTop[t] = byTop[t] || { again: [], rev: [], nw: [] }); (n ? byTop[t].nw : seenIds(t)[x.c.id] ? byTop[t].again : byTop[t].rev).push(x); } });
  const rev = [], nw = []; let left = 0;
  Object.entries(byTop).forEach(([t, g]) => {
    g.rev.sort((a, b) => (a.c.due||0) - (b.c.due||0)); g.nw.sort((a, b) => (a.c.created||0) - (b.c.created||0));
    let q = newQuota(t); rev.push(...g.again);
    const r = g.rev.slice(0, q); q -= r.length; rev.push(...r);
    const w = g.nw.slice(0, q); nw.push(...w);
    left += g.rev.length - r.length + g.nw.length - w.length;
  });
  return { rev, nw, newLeft: left };
}
function counts(fid){ const all = cardsIn(fid, true), t = todayCards(fid); return { total: all.length, due: t.rev.length + t.nw.length, rev: t.rev.length, nw: t.nw.length, newLeft: t.newLeft, own: fid ? Object.keys(S.decks[fid]||{}).length : 0 }; }
// Wie gut sitzt ein Ordner? Anteil der Karten mit mindestens 7 Tagen Abstand (neue und Lernkarten zählen als „noch nicht sicher“)
function mastery(fid){ const cs = cardsIn(fid, true), ok = cs.filter(x => (x.c.ivl || 0) >= 7).length, pct = cs.length ? Math.round(ok / cs.length * 100) : 0; return { pct, lv: pct >= 70 ? 2 : pct >= 35 ? 1 : 0 }; }
function cardState(c){ if (!c.reps) return "new"; if (!c.ivl) return "learn"; return c.ivl >= 21 ? "mature" : "young"; }
function streak(){ let n = 0, t = Date.now(); if (!S.days[dayKey(t)]) t -= DAY; while (S.days[dayKey(t)]) { n++; t -= DAY; } return n; }
const coverUrl = f => !f || !f.cover ? "" : f.cover.startsWith("asset:") ? "/_blob/" + f.cover.slice(6) : f.cover;
const colorOf = f => (f && f.color) || "#FF5A36";

/* ---------- Spaced repetition (SM-2 style, like Anki) ---------- */
function schedule(c0, g, now = Date.now()){
  const c = { ...c0, ease: c0.ease || 2.5, reps: (c0.reps||0) + 1, last: now };
  if (!c.ivl) {
    if (g === 0) { c.step = 0; c.due = now + MIN; }
    else if (g === 1) { c.step = c.step || 0; c.due = now + 6*MIN; }
    else if (g === 2) { if ((c.step||0) >= 1) { c.ivl = 1; c.step = 0; c.due = now + DAY; } else { c.step = 1; c.due = now + 10*MIN; } }
    else { c.ivl = 4; c.step = 0; c.due = now + 4*DAY; }
  } else if (g === 0) {
    c.lapses = (c.lapses||0) + 1; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = 0; c.step = 0; c.due = now + 10*MIN;
  } else {
    const hard = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2));
    const good = Math.max(hard + 1, Math.round(c.ivl * c.ease));
    const easy = Math.max(good + 1, Math.round(c.ivl * (c.ease + 0.15) * 1.3));
    if (g === 1) { c.ease = Math.max(1.3, c.ease - 0.15); c.ivl = hard; }
    else if (g === 2) { c.ivl = good; }
    else { c.ease = c.ease + 0.15; c.ivl = easy; }
    c.ivl = Math.min(c.ivl, 3650); c.due = now + c.ivl * DAY;
  }
  return c;
}
function fmtIvl(ms){
  const m = Math.round(ms / MIN);
  if (m < 60) return "< " + Math.max(1, m) + " Min";
  const h = Math.round(ms / 36e5); if (h < 24) return h + " Std";
  const d = Math.round(ms / DAY); if (d < 31) return d + " T";
  const mo = Math.round(d / 30.4); if (mo < 12) return mo + " Mon";
  return (d / 365).toFixed(1).replace(".", ",") + " J";
}

const BK_KEEP = 4, BK_EVERY = 7 * DAY, EXPORT_REMIND = 30 * DAY;

async function bkList(){

}

const exKey = (fid, id) => fid + "/" + id;
function exMatch(c){
  if (EX.which === "new") return !c.reps;
  if (EX.which === "hard") return (c.lapses || 0) > 0 || (c.ease || 2.5) < 2.5 || (!!c.reps && !c.ivl);

}
function exRows(){
  const root = EX.fid, rows = [], own = id => Object.values(S.decks[id] || {}).filter(exMatch).length;
  const depth = id => pathOf(id).length - pathOf(root).length;
  if (Object.keys(S.decks[root] || {}).length) rows.push({ id: root, name: S.folders[root].name, emoji: emo(S.folders[root]), d: 0, n: own(root), self: true });
  const walk = p => children(p).forEach(c => { if (cardsIn(c.id, true).length) { rows.push({ id: c.id, name: c.name, emoji: emo(c), d: depth(c.id) - 1, n: own(c.id) }); walk(c.id); } });
  walk(root); return rows;
}
function examPool(){
  const out = []; const ids = [EX.fid, ...descendants(EX.fid)].filter(id => EX.sel.has(id));
  ids.forEach(id => Object.values(S.decks[id] || {}).filter(exMatch).sort((a, b) => (a.created || 0) - (b.created || 0)).forEach(c => out.push({ fid: id, c })));

}

function examApply(g, cur){

function chartSVG(){
  const W = 640, H = 200, L = 30, R = 8, T = 10, B = 26, n = 30;
  const data = Array.from({length:n}, (_, i) => { const t = Date.now() - (n - 1 - i) * DAY; return { t, v: S.days[dayKey(t)] || 0 }; });
  const max = Math.max(4, ...data.map(d => d.v)), step = Math.ceil(max / 4), top = step * 4;
  const y = v => T + (H - T - B) * (1 - v / top), bw = (W - L - R) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wiederholungen pro Tag, letzte 30 Tage">`;
  for (let i = 0; i <= 4; i++) { const v = step * i; s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }
  data.forEach((d, i) => {
    const x = L + i * bw, h = (H - T - B) - (y(d.v) - T), dt = new Date(d.t), label = dt.toLocaleDateString("de-DE", { weekday:"short", day:"numeric", month:"short" });
    const r = Math.min(4, h / 2), bx = x + 1, w = bw - 2, by = y(d.v), base = H - B;
    const path = d.v ? `M${bx},${base}V${by + r}Q${bx},${by} ${bx + r},${by}H${bx + w - r}Q${bx + w},${by} ${bx + w},${by + r}V${base}Z` : "";
    s += `<g class="b" data-tip="${esc(label)}: ${d.v} Wiederholungen"><rect class="hit" x="${x}" y="${T}" width="${bw}" height="${H - T - B}"/>${path ? `<path class="barm ${i === n - 1 ? 'today' : ''}" d="${path}"/>` : ''}</g>`;
    if (i % 7 === 2 || i === n - 1) s += `<text class="axis" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${i === n - 1 ? "Heute" : dt.getDate() + "." + (dt.getMonth() + 1) + "."}</text>`;
  });
  return s + `<line class="gridl" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" style="stroke:var(--muted)"/></svg>`;
}

async function makeCover(file){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = AS ? 1100 : 640, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", AS ? .84 : .74));
  if (AS) { try { const r = await AS.upload(blob, { type: "image/jpeg" }); return "asset:" + r.id; } catch (e) { console.warn("upload", e); } }
  return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
}

function parseRows(text, sep, header){
  text = text.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  text = text.split("\n").filter(l => !/^#\w+:/.test(l)).join("\n");
  if (sep === "auto") { const s = text.slice(0, 3000); sep = s.includes("\t") ? "\t" : s.includes(";") ? ";" : s.includes(" - ") ? " - " : s.includes("|") ? "|" : ","; }
  let rows = [];
  if (sep.length > 1 || sep === "|") {
    rows = text.split("\n").map(l => { const i = l.indexOf(sep); return i < 0 ? null : [l.slice(0, i), l.slice(i + sep.length)]; }).filter(Boolean);
  } else {
    let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell === "") q = true;
      else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
  }
  if (header) rows.shift();
  return { sep, rows: rows.map(r => [cleanHtml(r[0] || ""), cleanHtml(r[1] || "")]).filter(r => r[0] && r[1]) };
}

    el.style.transition = "none"; el.style.transform = `translate3d(${dir === "left" ? W : -W}px,0,0)`; el.hidden = false;
  });
  peekGen = S.gen;
}
function schedulePrerender(){
  clearTimeout(prT);
  prT = setTimeout(() => { if (sw || animating) return; (window.requestIdleCallback || (f => f()))(() => { if (!sw && !animating) prerender(); }, { timeout: 600 }); }, 120);
}
function showPeek(dir){
  if (peekGen !== S.gen) prerender();
  const to = neighbour(dir), pk = PK();
  pk.left.style.visibility = pk.right.style.visibility = "hidden";
  if (!to) { peekDir = null; return false; }
  pk[dir].style.visibility = "visible"; peekDir = dir; return true;
}
function tabStyle(v, a, dur){ // a = 0 (inactive) … 1 (active)
  const b = document.querySelector(`#tabs [data-v="${v}"]`); if (!b) return;
  const svg = b.querySelector("svg"), t = dur ? `transform ${dur}ms ${EASE}, stroke-width ${dur}ms ${EASE}` : "none";
  svg.style.transition = t; b.style.transition = dur ? `color ${dur}ms ${EASE}` : "none";
  svg.style.transform = `scale(${(.84 + .16 * a).toFixed(3)})`; svg.style.strokeWidth = (1.6 + 1.3 * a).toFixed(2);
  b.style.color = `color-mix(in oklab, var(--accent-text) ${Math.round(a * 100)}%, var(--muted))`;
}
function clearTabStyles(){ document.querySelectorAll("#tabs button, #tabs svg").forEach(el => { el.style.transition = ""; el.style.transform = ""; el.style.strokeWidth = ""; el.style.color = ""; }); }
let curX = 0;
function place(x, dur, ease = EASE){
  const m = $("#main"), W = innerWidth, t = dur ? `transform ${dur}ms ${ease}` : "none"; curX = x;
  m.style.transition = t; m.style.transform = x ? `translate3d(${x}px,0,0)` : "";
  if (peekDir) {
    const pk = PK()[peekDir]; pk.style.transition = t;
    pk.style.transform = `translate3d(${x + (peekDir === "left" ? W : -W)}px,0,0)`;
    const p = Math.min(1, Math.abs(x) / W); tabStyle(S.view, 1 - p, dur); tabStyle(neighbour(peekDir), p, dur);
  }
}
function hidePeek(){
  const W = innerWidth, pk = PK();
  ["left", "right"].forEach(dir => { const el = pk[dir]; el.style.transition = "none"; el.style.visibility = "hidden"; el.style.transform = `translate3d(${dir === "left" ? W : -W}px,0,0)`; });
  peekDir = null;
}
function finish(commit, dir, v = 0){
  const W = innerWidth, target = commit ? (dir === "left" ? -W : W) : 0, dist = Math.abs(target - curX);
  // Speed of the finger carries over: fast flicks finish quickly, slow drags glide out calmly
  const speed = Math.max(Math.abs(v), .9); // px per ms
  const dur = Math.round(Math.max(170, Math.min(commit ? 360 : 300, dist / speed * 1.6)));
  const ease = commit ? "cubic-bezier(.25,.8,.3,1)" : "cubic-bezier(.3,1.25,.5,1)";
  animating = true; cancelAnimationFrame(raf2); place(target, dur, ease);
  setTimeout(() => {
    if (commit) { go(neighbour(dir), neighbour(dir) === "lib" ? libTarget() : null, "none"); draw(); }
    place(0, 0); hidePeek(); clearTabStyles(); $("#main").style.willChange = ""; animating = false;
    if (commit) prerender();
  }, dur + 16);
}
document.addEventListener("touchstart", e => {
  sw = null; if (animating || e.touches.length !== 1 || !canSwipe()) return;
  if (e.target.closest("input,textarea,select,.chart-wrap,[data-noswipe]")) return;
  const t = e.touches[0]; if (t.clientX < 18 || t.clientX > innerWidth - 18) return; // leave system edge gestures alone
  if (peekGen !== S.gen) prerender();
  sw = { x: t.clientX, y: t.clientY, drag: false, off: 0, pts: [[t.clientX, performance.now()]] };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!sw) return; const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.drag) {
    if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx) * .8) { sw = null; return; }
    if (Math.abs(dx) < 6) return;
    sw.drag = true; sw.off = Math.sign(dx) * 6; $("#main").style.willChange = "transform";
  }
  e.preventDefault(); // no vertical scrolling while swiping sideways
  const now = performance.now(); sw.pts.push([t.clientX, now]); while (sw.pts.length > 2 && now - sw.pts[0][1] > 90) sw.pts.shift();
  const x = dx - sw.off, has = showPeek(x < 0 ? "left" : "right");
  pendingX = has ? x : x / (1 + Math.abs(x) / 120) * .5; // rubber band where there is no page
  if (!raf2) raf2 = requestAnimationFrame(() => { raf2 = 0; if (sw && pendingX !== null) place(pendingX, 0); });
}, { passive: false });
function endSwipe(e){
  if (!sw) return; const s0 = sw; sw = null; if (!s0.drag) return;
  cancelAnimationFrame(raf2); raf2 = 0;
  const cx = e && e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : s0.pts[s0.pts.length - 1][0];
  const x = cx - s0.x - s0.off; if (peekDir || x) place(peekDir ? x : curX, 0);
  const a = s0.pts[0], b = s0.pts[s0.pts.length - 1], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]);
  const dir = x < 0 ? "left" : "right";
  const flick = Math.abs(v) > .35 && Math.sign(v) === Math.sign(x);
  const commit = !!neighbour(dir) && (Math.abs(x) > innerWidth * .4 || (flick && Math.abs(x) > 20));
  finish(commit, dir, v);
}
document.addEventListener("touchend", endSwipe, { passive: true });
document.addEventListener("touchcancel", () => { if (sw && sw.drag) { sw.pts = sw.pts.slice(-1); endSwipe(null); } sw = null; }, { passive: true });

// Two-finger swipe on a Mac trackpad
let wAcc = 0, wLock = 0, wT = 0;
document.addEventListener("wheel", e => {
  if (!canSwipe() || animating || e.ctrlKey) return;
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || e.target.closest(".chart-wrap")) return;
  const now = Date.now(); if (now < wLock) return; if (now - wT > 250) wAcc = 0; wT = now; wAcc += e.deltaX;
  if (Math.abs(wAcc) < 90) return;
  const dir = wAcc > 0 ? "left" : "right"; wAcc = 0; wLock = now + 700;
  if (!neighbour(dir)) return;
  if (reduceMotion.matches) { go(neighbour(dir), neighbour(dir) === "lib" ? libTarget() : null); return; }
  showPeek(dir); place(0, 0); $("#main").style.willChange = "transform";
  requestAnimationFrame(() => finish(true, dir, 1.4));
}, { passive: true });

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#menu").hidden) { closeMenu(); return; }
  if (e.key === "Escape" && !$("#sheet").hidden) { closeSheet(); return; }
  if (S.view !== "study" || !$("#sheet").hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if ((e.key === " " || e.key === "Enter") && S.study && !S.study.flipped) { e.preventDefault(); S.study.flipped = true; S.study.justFlipped = true; render(); }
  else if (/^[1-4]$/.test(e.key) && S.study && S.study.flipped && +e.key <= curGrades().length) { e.preventDefault(); grade(+e.key - 1); }
  else if ((e.key === "e" || e.key === "E") && !e.metaKey && !e.ctrlKey) { const c = curCard(); if (c && !S.study.busy) { e.preventDefault(); cardSheet(c.fid, c.id); } }
  else if ((e.key === "z" || e.key === "Z" || e.key === "Backspace") && !e.altKey) { e.preventDefault(); undoGrade(); }
  else if (e.key === "Escape") endStudy();
});

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
addEventListener("online", () => render()); addEventListener("offline", () => render());
// Merken, ob die Seite überhaupt scrollbar ist (dann darf sie am Rand weich nachfedern)
function updScroll(){ const r = document.documentElement; r.classList.toggle("can-scroll", r.scrollHeight > innerHeight + 2); }
addEventListener("resize", updScroll);
if (window.ResizeObserver) new ResizeObserver(updScroll).observe($("#main"));
try { history.scrollRestoration = "manual"; } catch {} window.scrollTo(0, 0); // Bibliothek öffnet immer oben
// Nach längerer Pause (App im Hintergrund) die Bibliothek wieder oben zeigen
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 60000 && S.view === "lib" && $("#sheet").hidden) window.scrollTo(0, 0); });
requestAnimationFrame(() => setTimeout(boot, 0)); // erst ein Bild zeichnen, damit die Startanimation schon auf der Grafikkarte läuft
})();
</script>
