# Hält das kostenlose Supabase-Projekt wach: alle 2 Tage eine kleine Datenbank-Anfrage.
# Liest keine Karten (öffentlicher Schlüssel, Zugriff pro Person abgesichert).
# Damit GitHub den Zeitplan nicht nach 60 Tagen ohne Änderungen abschaltet,
# wird bei Bedarf ein leerer "keepalive"-Commit angelegt.
name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anfragen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://rormgkvthvisrctcsjrg.supabase.co/rest/v1/docs?select=path&limit=1" \
            -H "apikey: sb_publishable_aG1Q3hPbrrVUGAqTPA7jUA_h2ThEaur")
          echo "Antwort: $code"
          test "$code" = "200"

      - uses: actions/checkout@v4

      - name: Repository aktiv halten
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898981+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
